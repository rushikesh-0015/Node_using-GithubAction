name: Full CI/CD Pipeline - Node ECS

on:
  push:
    branches:
      - master

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    environment: Global

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # ------------------ SONARQUBE ------------------
    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORG }}
          -Dsonar.sources=.

    # ------------------ AWS LOGIN ------------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    # ------------------ DOCKER BUILD ------------------
    - name: Build Docker Image
      run: |
        docker build -t node-ecr-app .

    # ------------------ TRIVY SCAN ------------------
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: node-ecr-app
        severity: CRITICAL,HIGH
        exit-code: 1

    # ------------------ PUSH TO ECR ------------------
    - name: Push Image to ECR
      run: |
        docker tag node-ecr-app:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/node-ecr-app:latest
        docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/node-ecr-app:latest

    # ------------------ DEPLOY TO ECS ------------------
    - name: Deploy to ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: task-definition.json
        service: node-service
        cluster: node-cluster
        wait-for-service-stability: true
